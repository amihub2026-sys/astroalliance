<div class="admin-layout">
<aside
  class="sidebar"
  [class.open]="sidebarOpen"
  (click)="$event.stopPropagation()">

   <div class="brand">
  <h2>ASTRO ALLIANCE</h2>
  <!-- <h6>{{ currentLang === 'ta' ? 'அட்மின் பேனல்' : 'Admin Panel' }}</h6> -->

  <div class="admin-profile-box">
    <div class="admin-avatar">
      {{ adminName.charAt(0).toUpperCase() }}
    </div>

    <div class="admin-user-details">
      <h4>{{ adminName }}</h4>
      <!-- <span>{{ currentLang === 'ta' ? 'நிர்வாகி' : 'Administrator' }}</span> -->
    </div>

    <button type="button" class="logout-btn" (click)="logoutAdmin()">
      Logout
    </button>
  </div>
  <div class="admin-language-switcher">

    <button
      type="button"
      [class.active]="currentLang === 'en'"
      (click)="changeLanguage('en')">
      EN
    </button>

    <button
      type="button"
      [class.active]="currentLang === 'ta'"
      (click)="changeLanguage('ta')">
      தமிழ்
    </button>

  </div>

</div>

<nav class="nav-menu">

<a
  routerLink="/admin/dashboard"
  routerLinkActive="active"
  class="nav-item"
  (click)="sidebarOpen = false">
  Dashboard
</a>

<a
  routerLink="/admin/profiles"
  routerLinkActive="active"
  class="nav-item"
  (click)="sidebarOpen = false">
  Profiles
</a>

<a
  routerLink="/admin/plans"
  routerLinkActive="active"
  class="nav-item"
  (click)="sidebarOpen = false">
  Plans
</a>

<a
  routerLink="/admin/subscriptions"
  routerLinkActive="active"
  class="nav-item"
  (click)="sidebarOpen = false">
  User Plans
</a>

<a

  (click)="sidebarOpen = false">
  Cities
</a>

<a
  routerLink="/admin/profile-views"
  routerLinkActive="active"
  class="nav-item"
  (click)="sidebarOpen = false">
  Profile Views
</a>

<a
  routerLink="/admin/interests"
  routerLinkActive="active"
  [routerLinkActiveOptions]="{ exact: true }"
  class="nav-item"
  (click)="closeSidebar()">
  Interests
</a>
<a
  routerLink="/admin/shortlists"
  routerLinkActive="active"
  class="nav-item"
  (click)="sidebarOpen = false">
  Shortlists
</a>

<a
  routerLink="/admin/likes-history"
  routerLinkActive="active"
  class="nav-item"
  (click)="sidebarOpen = false">
  Likes History
</a>
<a
  routerLink="/admin/admin-users"
  routerLinkActive="active"
  class="nav-item"
  (click)="sidebarOpen = false">
  Admin Users
</a>
<a
  [routerLink]="['/admin/create-biodata']"
  [queryParams]="{ adminCreate: 'true' }"
  routerLinkActive="active"
  class="nav-item"
  (click)="sidebarOpen = false">
  User Registration
</a>

</nav>

  </aside>
<div
  class="mobile-overlay"
  *ngIf="sidebarOpen"
  (click)="sidebarOpen = false">
</div>
